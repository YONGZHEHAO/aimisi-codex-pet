name: All public repositories - Star email notifications

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  watch:
    types: [started]
  push:
    branches: [main]
    paths: ['.github/workflows/star-email.yml']
  workflow_dispatch:
    inputs:
      send_test_email:
        description: 'Send a test email after the repository scan'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: all-public-repositories-star-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.repository == 'YONGZHEHAO/aimisi-codex-pet'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discover repositories and email new stars
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAR_GITHUB_TOKEN: ${{ secrets.STAR_GITHUB_TOKEN }}
          MAIL_ACCOUNT: ${{ secrets.STAR_MAIL_ACCOUNT }}
          MAIL_AUTH_CODE: ${{ secrets.STAR_MAIL_AUTH_CODE }}
          SEND_TEST_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_email }}
        shell: python
        run: |
          """Monitor public repository star growth using GitHub's aggregate history API."""
          import base64
          import copy
          import json
          import os
          import smtplib
          import ssl
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from email.message import EmailMessage
          
          OWNER = "YONGZHEHAO"
          STATE_BRANCH = "star-notification-state"
          STATE_PATH = ".github/star-monitor/state.json"
          
          
          class GitHub:
              def __init__(self, token):
                  self.token = token
          
              def request(self, path, method="GET", data=None, missing_ok=False):
                  headers = {"Authorization": f"Bearer {self.token}", "Accept": "application/vnd.github+json",
                             "User-Agent": "YONGZHEHAO-star-monitor", "X-GitHub-Api-Version": "2026-03-10"}
                  body = None if data is None else json.dumps(data).encode("utf-8")
                  if body is not None:
                      headers["Content-Type"] = "application/json"
                  req = urllib.request.Request("https://api.github.com" + path, data=body, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=45) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code == 404 and missing_ok:
                          return None
                      try:
                          message = json.loads(error.read().decode("utf-8")).get("message", "No message")
                      except (ValueError, UnicodeDecodeError):
                          message = "No structured error message"
                      if self.token:
                          message = message.replace(self.token, "[redacted]")
                      raise RuntimeError(f"GitHub HTTP {error.code} for {path}: {message}") from None
          
              def repositories(self):
                  page = 1
                  while True:
                      batch = self.request(f"/users/{OWNER}/repos?type=owner&sort=full_name&per_page=100&page={page}")
                      if not isinstance(batch, list):
                          raise RuntimeError("Unexpected repository response")
                      for repo in batch:
                          if not repo.get("private") and repo["owner"]["login"].lower() == OWNER.lower():
                              yield repo
                      if len(batch) < 100:
                          return
                      page += 1
          
          
          def daily_counts(history):
              if not isinstance(history, list):
                  raise RuntimeError("Unexpected star history response")
              days = {}
              for week in history:
                  if not isinstance(week.get("week"), int) or len(week.get("days", [])) != 7:
                      raise RuntimeError("Invalid star history week")
                  for index, count in enumerate(week["days"]):
                      if not isinstance(count, int) or count < 0:
                          raise RuntimeError("Invalid daily star count")
                      # Compare GitHub's own bucket IDs; its calendar boundaries may differ from UTC.
                      days[f"{week['week']}:{index}"] = count
              return days
          
          
          def detect(state, repositories, get_history):
              updated = copy.deepcopy(state)
              notices = []
              initialized = state.get("initialized", False)
              for repo in repositories:
                  repo_id = str(repo["id"])
                  current = daily_counts(get_history(repo))
                  previous = state["repositories"].get(repo_id)
                  if initialized:
                      if previous is None:
                          # Newly discovered public repository: report current stars once, clearly labelled.
                          increase = int(repo["stargazers_count"])
                      else:
                          increase = sum(max(0, count - previous["days"].get(day, 0))
                                         for day, count in current.items())
                      if increase:
                          notices.append({"repository": repo["full_name"], "increase": increase,
                                          "total": repo["stargazers_count"], "new_repository": previous is None})
                  updated["repositories"][repo_id] = {"name": repo["full_name"], "days": current,
                                                       "total": repo["stargazers_count"]}
              updated["initialized"] = True
              return updated, notices
          
          
          def send_mail(account, password, subject, body):
              message = EmailMessage()
              message["From"] = account
              message["To"] = account
              message["Subject"] = subject
              message.set_content(body)
              with smtplib.SMTP_SSL("smtp.qq.com", 465, context=ssl.create_default_context(), timeout=30) as smtp:
                  smtp.login(account, password)
                  smtp.send_message(message)
          
          
          def deliver_and_save(previous, updated, notices, send, save, test=False):
              if notices:
                  lines = ["检测到你的公开项目 Star 统计增加：", ""]
                  for notice in notices:
                      change = (f"新发现的公开项目，当前有 {notice['total']} 个 Star"
                                if notice["new_repository"] else f"新增 {notice['increase']} 个 Star；当前总数 {notice['total']}")
                      lines.extend([f"项目：{notice['repository']}", change,
                                    f"https://github.com/{notice['repository']}", ""])
                  lines.append("计划每 15 分钟检查；以 GitHub 统计更新为准，短暂 Star 或同时取消可能无法识别。")
                  send("[GitHub Star] 你的项目 Star 增加了", "\n".join(lines))
              elif not previous.get("initialized") or test:
                  send("[GitHub Star] 自动监控已启用" if not previous.get("initialized") else "[GitHub Star] 自动监控测试成功",
                       f"已扫描 {len(updated['repositories'])} 个公开项目，读取 Star 统计成功。\n"
                       "计划每 15 分钟检查，有新增 Star 统计才发邮件；以后新增的公开项目自动纳入。\n"
                       "首次扫描建立基线，不补发已有 Star；新发现的项目已有 Star 时会单独说明。\n"
                       "这是配置验证邮件，不代表新增 Star。")
              # A send failure must leave the old baseline intact so the next run can retry.
              if updated != previous:
                  save(updated)
          
          
          def main():
              account = os.environ.get("MAIL_ACCOUNT", "").strip()
              password = os.environ.get("MAIL_AUTH_CODE", "").strip()
              if not account or not password:
                  raise RuntimeError("Configure STAR_MAIL_ACCOUNT and STAR_MAIL_AUTH_CODE in Actions secrets")
              state_api = GitHub(os.environ["GITHUB_TOKEN"])
              read_api = GitHub(os.environ.get("STAR_GITHUB_TOKEN", "").strip() or os.environ["GITHUB_TOKEN"])
              host_repo = os.environ["GITHUB_REPOSITORY"]
              endpoint = f"/repos/{host_repo}/contents/{STATE_PATH}"
              stored = state_api.request(f"{endpoint}?ref={STATE_BRANCH}", missing_ok=True)
              if stored is None:
                  previous = {"version": 2, "initialized": False,
                              "created_at": datetime.now(timezone.utc).isoformat(), "repositories": {}}
              else:
                  previous = json.loads(base64.b64decode(stored["content"]))
                  if previous.get("version") != 2 or not isinstance(previous.get("repositories"), dict):
                      raise RuntimeError("Incompatible state; refusing to overwrite notification records")
              repositories = list(read_api.repositories())
              if not repositories:
                  raise RuntimeError("No public repositories returned; refusing to initialize an empty baseline")
              updated, notices = detect(previous, repositories,
                  lambda repo: read_api.request(f"/repos/{repo['full_name']}/stargazers/history?per_page=30&page=1"))
          
              def save(state):
                  if stored is None:
                      ref = state_api.request(f"/repos/{host_repo}/git/ref/heads/{STATE_BRANCH}", missing_ok=True)
                      if ref is None:
                          state_api.request(f"/repos/{host_repo}/git/refs", "POST",
                                            {"ref": f"refs/heads/{STATE_BRANCH}", "sha": os.environ["GITHUB_SHA"]})
                  payload = {"message": "Update star notification delivery state", "branch": STATE_BRANCH,
                             "content": base64.b64encode((json.dumps(state, indent=2) + "\n").encode()).decode()}
                  if stored is not None:
                      payload["sha"] = stored["sha"]
                  state_api.request(endpoint, "PUT", payload)
          
              deliver_and_save(previous, updated, notices,
                  lambda subject, body: send_mail(account, password, subject, body), save,
                  test=os.environ.get("SEND_TEST_EMAIL", "false").lower() == "true")
              summary = f"Scanned {len(repositories)} public repositories; {len(notices)} repositories with increased star counts. State saved successfully."
              print(summary)
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
                      stream.write(summary + "\n")
          
          
          if __name__ == "__main__":
              main()
